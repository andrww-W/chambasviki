    <title>Formulario</title>
</head>
<body style="background-color: rgb(219, 224, 141);">
    <fieldset> <legend> Datos Personales</legend>
    <Form method="get" name="Datos">
        Escribe tu nombre: <br>
        <input type="text" name="nombre" id="nombre" maxlength="40"><br>
        <br>
        Escribe tus apellidos: 
        <br>
        <br>
        <input type="text" name="Apellido" id="Ap">
        <br>
        Escribe tu edad: 
        <br>
        <input type="number" name="Edad" id="Edad">
        <br>
        <br>
        Selecciona tu color favorito:
        <br>
        <input type="color" name="color" id="Color">
        <br>
        <br>
        <input type="submit" value="Enviar Datos">
        <br>
        <br>
        <input type="reset" value="Limpiar">
    </Form>
</fieldset><br>
